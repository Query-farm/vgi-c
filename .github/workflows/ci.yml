# Build vgi-c against vgi-rpc-c, run the native tests, and run the canonical
# Query-farm/vgi integration sqllogictest suite against the C example worker
# with the native runner built at the pinned VGI commit, so the SDK cannot
# silently fall behind the extension's protocol. See ci/run-integration.sh.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test sources and the statically linked native runner come from this exact
  # VGI commit (protocol vgi.v3 / 3.4.0, with the large-value vendor-lane files
  # and protocol version negotiation, PROTOCOL_VERSIONS_V1, on Haybarn
  # 2.0.1-rc3). Stays on this protocol-3.4 commit until the extension ships on
  # v2.0 (after the worker fleet); then repin to the released v2.0 commit.
  VGI_REF: ebf28ead2703ab2b0f3ec818aa9a63a99bd8863f
  VGI_NATIVE_RUNNER_BRANCH: protocol-3.4
  # The vgi-rpc-c commit this SDK builds against: protocol-3.4 2197025, v0.2.0
  # plus storage stall timeouts, protocol version negotiation and the
  # vendor-only storage-backend check (repin to the next release). v0.2.0
  # brought upload-URL v2, JWT verification and authentication before the body
  # for hosted mode, StateRef, argument references, the object cache and the
  # blob-vendor client.
  VGI_RPC_C_REF: 21970253a2796e85ff8ca87ae3a2979c75915ed1
  # The Orchard hosted-mode conformance harness (test/hosted/) comes from
  # VGI_REF; these are the Python client pins it is tested with. vgi-rpc stays
  # a git pin while the vgi-python commit carries a [tool.uv.sources] git pin
  # for it (uv honours it, so a PyPI vgi-rpc==0.57.0 cannot resolve beside it).
  VGI_PYTHON_HOSTED_REF: 85ae674bb83aa3d3eb0b05e01c7b5ceb0984b6cd
  VGI_RPC_PYTHON_HOSTED_REF: f0fb6754ae5b70900ba21629a1e2d48eb2182774

jobs:
  build:
    name: Build and native tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check out vgi-rpc-c
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-c
          ref: ${{ env.VGI_RPC_C_REF }}
          path: vgi-rpc-c

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libjson-c-dev libsodium-dev libsqlite3-dev \
            libevent-dev libcurl4-openssl-dev libzstd-dev liblz4-dev zlib1g-dev libssl-dev

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DVGI_RPC_SOURCE_DIR="$GITHUB_WORKSPACE/vgi-rpc-c"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Native tests
        run: ctest --test-dir build --output-on-failure

      # upload-artifact does not preserve the executable bit.
      - name: Package worker
        run: tar -czf vgi-c-worker.tar.gz -C build/example-worker vgi-example-worker

      - name: Upload worker
        uses: actions/upload-artifact@v4
        with:
          name: vgi-c-worker-${{ github.sha }}
          path: vgi-c-worker.tar.gz
          if-no-files-found: error
          retention-days: 1

  integration:
    name: Integration (${{ matrix.transport }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        transport: [stdio, launch, http]
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned vgi test suite
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_REF }}
          path: vgi-upstream
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjson-c5 libsodium23 libsqlite3-0 libevent-2.1-7t64 \
            libevent-pthreads-2.1-7t64 libcurl4t64 libzstd1 liblz4-1 zlib1g libssl3t64

      - name: Download worker
        uses: actions/download-artifact@v4
        with:
          name: vgi-c-worker-${{ github.sha }}

      - name: Extract worker
        run: mkdir -p bin && tar -xzf vgi-c-worker.tar.gz -C bin

      - name: Download native runner matching the test suite
        env:
          GH_TOKEN: ${{ github.token }}
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
        run: |
          python3 "$VGI_SRC/scripts/ci_fetch_native_runner.py" \
            --source "$VGI_SRC" --output "$RUNNER_TEMP/vgi-native"

      - name: Run integration suite (${{ matrix.transport }})
        run: ci/run-integration.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          VGI_WORKER_BIN: ${{ github.workspace }}/bin/vgi-example-worker
          TRANSPORT: ${{ matrix.transport }}

  vendor:
    # The extension's blob-vendor lane (make test_http_vendor) against this
    # worker: test/sql/external_storage/* (including the protocol 3.4
    # arguments_ref*.test files) and the integration suite over HTTP with
    # every value externalized through the fake vendor. See ci/run-vendor.sh.
    name: Blob vendor lane
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned vgi test suite
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_REF }}
          path: vgi-upstream
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjson-c5 libsodium23 libsqlite3-0 libevent-2.1-7t64 \
            libevent-pthreads-2.1-7t64 libcurl4t64 libzstd1 liblz4-1 zlib1g libssl3t64

      # The fake vendor runs with uvx from a pinned vgi-rpc-python commit.
      - uses: astral-sh/setup-uv@v6

      - name: Download worker
        uses: actions/download-artifact@v4
        with:
          name: vgi-c-worker-${{ github.sha }}

      - name: Extract worker
        run: mkdir -p bin && tar -xzf vgi-c-worker.tar.gz -C bin

      - name: Download native runner matching the test suite
        env:
          GH_TOKEN: ${{ github.token }}
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
        run: |
          python3 "$VGI_SRC/scripts/ci_fetch_native_runner.py" \
            --source "$VGI_SRC" --output "$RUNNER_TEMP/vgi-native"

      - name: Run the vendor lane
        run: ci/run-vendor.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          VGI_WORKER_BIN: ${{ github.workspace }}/bin/vgi-example-worker

  hosted:
    name: Orchard hosted mode
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check out the hosted-mode conformance harness
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_REF }}
          path: vgi-upstream
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjson-c5 libsodium23 libsqlite3-0 libevent-2.1-7t64 \
            libevent-pthreads-2.1-7t64 libcurl4t64 libzstd1 liblz4-1 zlib1g libssl3t64

      - uses: astral-sh/setup-uv@v6

      - name: Download worker
        uses: actions/download-artifact@v4
        with:
          name: vgi-c-worker-${{ github.sha }}

      - name: Extract worker
        run: mkdir -p bin && tar -xzf vgi-c-worker.tar.gz -C bin

      - name: Shared hosted-mode conformance harness
        run: |
          W="$GITHUB_WORKSPACE/bin/vgi-example-worker"
          vgi-upstream/test/hosted/run_hosted_conformance.py \
            --worker-cwd "$GITHUB_WORKSPACE" \
            --worker-cmd "$W --http 0" \
            --refuse-cmd "$W" \
            --refuse-cmd "$W --tcp 127.0.0.1:{port}" \
            --refuse-cmd "$W --unix $RUNNER_TEMP/vgi-c-hosted-{port}.sock" \
            --streaming-body

      - name: Hosted-mode tests (port of vgi-python's)
        env:
          VGI_WORKER_BIN: ${{ github.workspace }}/bin/vgi-example-worker
        run: |
          uv run --no-project -p 3.13 \
            --with "vgi-python[oauth] @ git+https://github.com/Query-farm/vgi-python@${VGI_PYTHON_HOSTED_REF}" \
            --with "vgi-rpc[http,oauth] @ git+https://github.com/Query-farm/vgi-rpc-python@${VGI_RPC_PYTHON_HOSTED_REF}" \
            --with pytest \
            python -m pytest tests/check_hosted.py -v
